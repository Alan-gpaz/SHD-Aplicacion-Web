
<div class="container d-flex justify-content-center align-items-center min-vh-100">

  <div class="card shadow p-4" style="width: 400px;">

    <h3 class="text-center mb-4">Iniciar sesión</h3>

    <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()">

      <div class="mb-3">
        <label class="form-label">Usuario</label>

        <input
          type="text"
          class="form-control"
          formControlName="username"
          placeholder="Ingresa tu usuario"
        >

        @if (formulario.controls.username.touched &&
             formulario.controls.username.invalid) {
          <small class="text-danger">
            El usuario es obligatorio (mínimo 3 caracteres)
          </small>
        }
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>

        <input
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="Ingresa tu contraseña"
        >

        @if (formulario.controls.password.touched &&
             formulario.controls.password.invalid) {
          <small class="text-danger">
            La contraseña es obligatoria
          </small>
        }
      </div>

      @if (error()) {
        <div class="alert alert-danger">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        class="btn btn-primary w-100"
        [disabled]="loading()"
      >
        {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>

    </form>

  </div>

</div>
